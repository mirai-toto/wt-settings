[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wt-settings"
version = "0.1.0"
description = "A CLI to read and write Windows Terminal settings.json"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
]

[project.scripts]
wts = "wt_settings.main:app"

[tool.hatch.build.targets.wheel]
packages = ["wt_settings"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.5",
]
